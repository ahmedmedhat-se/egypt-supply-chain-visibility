name: CI

on:
  # Fast checks only — run on every push to ANY branch and on every PR.
  # Heavy image builds + publishing live in docker-publish.yml, so pushing
  # a branch never burns ~30 minutes on an OSRM preprocess.
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Server: lint (read-only), Prisma schema validation, typecheck, unit tests
  # ---------------------------------------------------------------------------
  server:
    name: Server · lint + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck + build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

  # ---------------------------------------------------------------------------
  # Client: lint + production build
  # ---------------------------------------------------------------------------
  client:
    name: Client · lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build

  # ---------------------------------------------------------------------------
  # E2E: boot the full NestJS AppModule against real postgres/redis/rabbitmq.
  # The DB is created fresh from migrations — no seed data needed. OSRM_URL
  # points at the public demo server; the e2e spec doesn't exercise routing.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E · server against real infra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escv_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d escv_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        # Note: the rabbitmq image refuses RABBITMQ_DEFAULT_USER=guest, so use
        # dedicated CI credentials.
        image: rabbitmq:3.12-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: escv
          RABBITMQ_DEFAULT_PASS: escv
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/escv_db
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      RABBITMQ_URL: amqp://escv:escv@localhost:5672
      OSRM_URL: https://router.project-osrm.org/route/v1/driving
      # Keep the real secrets in repo/org secrets; these defaults satisfy Joi's
      # minimum-length validation so the workflow runs out of the box.
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'ci-access-secret-0123456789abcdef0123456789abcdef' }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-refresh-secret-0123456789abcdef0123456789abcdef' }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET || 'ci-cookie-secret-0123456789abcdef' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # --forceExit: the boot delay scan keeps a timer alive past the tests;
      # without it jest would hang waiting for open handles after a green run.
      - name: Run e2e tests
        run: npm run test:e2e -- --runInBand --forceExit
